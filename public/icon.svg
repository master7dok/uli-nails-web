<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep warm espresso / luxury black -->
    <radialGradient id="bgGrad" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#2C2522" />
      <stop offset="60%" stop-color="#1B1715" />
      <stop offset="100%" stop-color="#100D0C" />
    </radialGradient>

    <!-- Rich Champagne Gold Gradient -->
    <linearGradient id="goldGrad" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#FFF6E2" />
      <stop offset="28%" stop-color="#E8C88A" />
      <stop offset="60%" stop-color="#C69E56" />
      <stop offset="85%" stop-color="#E2C17D" />
      <stop offset="100%" stop-color="#9C7330" />
    </linearGradient>

    <!-- Ring Accent Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7DEA6" />
      <stop offset="50%" stop-color="#9A7233" />
      <stop offset="100%" stop-color="#E8C88A" />
    </linearGradient>

    <!-- Soft highlight for gel curve -->
    <linearGradient id="highlightGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="60%" stop-color="#FFF1D2" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#CAA158" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Luxury Circular Badge Base -->
  <circle cx="256" cy="256" r="244" fill="url(#bgGrad)" />
  <!-- Outer Gold Border -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#ringGrad)" stroke-width="12" />

  <!-- Inner Delicate Ring for luxury emblem feeling -->
  <circle cx="256" cy="256" r="218" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.4" />

  <!-- Center Artwork: Stylized Manicured Almond Nail Contour -->
  <g transform="translate(0, 10)">
    <!-- Almond Nail Outer Shell -->
    <path
      d="M 184 352
         C 178 266, 186 190, 220 134
         C 236 104, 256 84, 256 84
         C 256 84, 276 104, 292 134
         C 326 190, 334 266, 328 352
         C 322 372, 298 380, 256 380
         C 214 380, 190 372, 184 352 Z"
      fill="url(#goldGrad)"
    />

    <!-- Inner Core: Elegant dark negative space showcasing the Apex -->
    <path
      d="M 204 340
         C 200 270, 208 204, 232 154
         C 244 130, 256 112, 256 112
         C 256 112, 268 130, 280 154
         C 304 204, 312 270, 308 340
         C 302 352, 284 358, 256 358
         C 228 358, 210 352, 204 340 Z"
      fill="#1A1615"
    />

    <!-- Prominent Monogram 'U' in Center (Uliana) -->
    <path
      d="M 230 198
         L 230 274
         C 230 292, 240 304, 256 304
         C 272 304, 282 292, 282 274
         L 282 198
         L 296 198
         L 296 274
         C 296 302, 278 318, 256 318
         C 234 318, 216 302, 216 274
         L 216 198 Z"
      fill="url(#goldGrad)"
    />
    <!-- Serif footings -->
    <rect x="210" y="196" width="22" height="6" rx="2" fill="url(#goldGrad)" />
    <rect x="282" y="196" width="22" height="6" rx="2" fill="url(#goldGrad)" />

    <!-- Gel Apex Highlight Arc ('Ідеальний Блік') -->
    <path
      d="M 218 184
         C 225 152, 238 128, 248 112
         C 243 126, 234 152, 229 184
         C 225 212, 224 246, 226 280
         C 222 246, 221 212, 218 184 Z"
      fill="url(#highlightGrad)"
    />
  </g>

  <!-- Big Brilliant 4-Point Diamond Sparkle at Apex (Glint / Shine) -->
  <g transform="translate(306, 92)">
    <!-- Outer diamond rays -->
    <path
      d="M 0 -44
         C 3 -12, 12 -3, 44 0
         C 12 3, 3 12, 0 44
         C -3 12, -12 3, -44 0
         C -12 -3, -3 -12, 0 -44 Z"
      fill="url(#goldGrad)"
    />
    <!-- Diagonal cross rays -->
    <path
      d="M 0 -22
         C 2 -6, 6 -2, 22 0
         C 6 2, 2 6, 0 22
         C -2 6, -6 2, -22 0
         C -6 -2, -2 -6, 0 -22 Z"
      transform="rotate(45)"
      fill="#FFFBF2"
    />
    <!-- Diamond core -->
    <circle cx="0" cy="0" r="7" fill="#FFFFFF" />
  </g>

  <!-- Small Delicate Secondary Sparkle -->
  <g transform="translate(176, 168)">
    <path
      d="M 0 -18
         C 1 -5, 5 -1, 18 0
         C 5 1, 1 5, 0 18
         C -1 5, -5 1, -18 0
         C -5 -1, -1 -5, 0 -18 Z"
      fill="#FFF0D2"
    />
    <circle cx="0" cy="0" r="3" fill="#FFFFFF" />
  </g>
</svg>